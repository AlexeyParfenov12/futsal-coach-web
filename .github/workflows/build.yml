name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build:gas
      - name: Upload Apps Script package
        uses: actions/upload-artifact@v4
        with:
          name: futsal-coach-apps-script
          path: apps-script/
          if-no-files-found: error
